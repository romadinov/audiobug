name: Audiobug
options:
  bundleIdPrefix: com.romadinov
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  AudiobugCore:
    path: Packages/AudiobugCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: SZVSSCJQFN   # Alexey Romadinov (Individual)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    # Raise for every install (scripts/bump-build.sh): iCloud only re-reads NSUbiquitousContainers
    # (the "Audiobug" folder in iCloud Drive) when the build number changes.
    CURRENT_PROJECT_VERSION: "17"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  Audiobug:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: AudiobugCore
      - target: AudiobugWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romadinov.audiobug
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Audiobug
        CODE_SIGN_ENTITLEMENTS: App/Audiobug.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Audiobug
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The Books folder is visible in the Files app (On My iPhone › Audiobug › Books).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audiobook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, com.apple.m4a-audio, public.mp3, com.apple.protected-mpeg-4-audio]
        # Books dropped in iCloud Drive › Audiobug › Inbox are imported into the library.
        NSUbiquitousContainers:
          iCloud.com.romadinov.audiobug:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Audiobug
            NSUbiquitousContainerSupportedFolderLevels: Any
        # Playback continues in the background; the Inbox is also imported in the background.
        UIBackgroundModes: [audio, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.romadinov.audiobug.inbox.refresh
          - com.romadinov.audiobug.inbox.import

  AudiobugWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    dependencies:
      - package: AudiobugCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romadinov.audiobug.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Audiobug
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.romadinov.audiobug
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        SKIP_INSTALL: YES
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Audiobug
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Audiobug downloads books from your iPhone over Wi-Fi.
        WKCompanionAppBundleIdentifier: com.romadinov.audiobug
        WKRunsIndependentlyOfCompanionApp: true
        UIBackgroundModes: [audio]

  AudiobugUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Audiobug
    settings:
      base:
        TEST_TARGET_NAME: Audiobug
        GENERATE_INFOPLIST_FILE: YES

  AudiobugWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [WatchUITests]
    dependencies:
      - target: AudiobugWatch
    settings:
      base:
        TEST_TARGET_NAME: AudiobugWatch
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Audiobug:
    build:
      targets:
        Audiobug: all
        AudiobugUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [AudiobugUITests]
    archive:
      config: Release
  AudiobugWatch:
    build:
      targets:
        AudiobugWatch: all
        AudiobugWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [AudiobugWatchUITests]
